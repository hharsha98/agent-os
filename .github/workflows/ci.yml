name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: env -u HERMES_HOME npm test
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: env -u HERMES_HOME npm test
      - name: Start server and smoke
        env:
          AGENT_OS_TOKEN: ci-smoke-token
        run: |
          cp -n .env.example .env || true
          node server/index.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Agent OS server did not become healthy on :8090"
            exit 1
          fi
          npm run smoke:local
          npm run smoke:public

  # The desktop shell (Rust, Tauri 2) on all three systems: the server bundle
  # with node-pty for this runner, then a debug build of the shell and its unit
  # tests. No installer is made here; release.yml makes those for tags.
  desktop:
    # It runs third-party actions (rust-toolchain, rust-cache), so it only reads the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tauri v2's Linux prerequisites on ubuntu-22.04 (the same list as release.yml).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev
      - run: npm ci
      # The UI and the server bundle, with node-pty's prebuilt binary for this
      # runner, into desktop/src-tauri/resources/server.
      - name: Prepare the server bundle
        run: node scripts/prepare-desktop.mjs --skip-node
      # tauri-build stops when a resource folder named in tauri.conf.json is
      # missing. The bundled Node is only needed for an installer, so an empty
      # folder is enough for this build.
      - name: Make the empty Node resources folder
        shell: bash
        run: mkdir -p desktop/src-tauri/resources/node
      - name: Build the desktop shell
        working-directory: desktop/src-tauri
        run: cargo build --locked
      - name: Run the desktop shell's unit tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
