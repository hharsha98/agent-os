name: Package check

# A proof, before a release is tagged, that the installers really install and run. It builds
# the four installers exactly as release.yml does (same targets, same Node download, same
# prepare step), but without signing and without the updater. Then it installs each one on
# its own kind of computer and runs scripts/install-smoke.mjs against the installed app.
#
# It runs for a pull request into main whose branch starts with "release/" (and by hand).
# It holds no repository secrets at all (test/release-config.test.js checks that), and its
# token is read-only.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only release branches of this repository (a fork's pull request is not built here), or a manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/'))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (DMG)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            node_platform: darwin
            node_arch: arm64
            args: --target aarch64-apple-darwin
          # Intel Mac built by cross-compiling on the Apple Silicon runner, as release.yml does.
          # This is the first time that build is tried before a tag.
          - name: macOS Intel (DMG)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            node_platform: darwin
            node_arch: x64
            args: --target x86_64-apple-darwin
          - name: Linux (DEB + AppImage)
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            node_platform: linux
            node_arch: x64
            args: --bundles deb,appimage
          - name: Windows (NSIS setup.exe)
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            node_platform: win32
            node_arch: x64
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # The same Linux prerequisites as release.yml.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Install dependencies
        run: npm ci

      - name: Fetch the bundled Node for this target
        run: node scripts/fetch-node.mjs --platform ${{ matrix.node_platform }} --arch ${{ matrix.node_arch }}

      - name: Prepare desktop resources
        run: node scripts/prepare-desktop.mjs --skip-node --platform ${{ matrix.node_platform }} --arch ${{ matrix.node_arch }}

      # The lockfile's Tauri CLI, run directly. No signing key and no updater: this build is only
      # for the smoke job below. CI=true skips the macOS DMG "make Finder pretty" step, which
      # hangs on a headless runner, and is set for THIS step only. bash on every system, so the
      # "--" before --locked reaches cargo the same way everywhere.
      - name: Build the installer
        shell: bash
        working-directory: desktop
        env:
          CI: true
        run: npx --no-install tauri build ${{ matrix.args }} -- --locked

      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.rust_target }}
          if-no-files-found: error
          retention-days: 3
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/*/release/bundle/dmg/*.dmg

      # The server image: Node 24, runs as the "node" user, health check. It starts a container
      # on this runner, so it is part of the Linux leg only.
      - name: Docker image smoke
        if: matrix.platform == 'ubuntu-22.04'
        env:
          HERMES_DOCKER_SMOKE_REQUIRED: "1"
        run: npm run smoke:docker

  smoke:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (setup.exe)
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - name: Linux (.deb)
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon (DMG)
            platform: macos-15
            rust_target: aarch64-apple-darwin
          - name: macOS Intel (DMG)
            platform: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    name: Smoke ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ matrix.rust_target }}
          path: installer

      # ---- Linux: install the .deb with apt, then run the app under a virtual display and session bus
      # (scripts/install-smoke.mjs starts itself again under dbus-run-session and xvfb-run).
      - name: Install and smoke test the .deb
        if: runner.os == 'Linux'
        shell: bash
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus xvfb
          cp "$(find installer -name '*.deb' | head -n 1)" ./agent-os.deb
          sudo apt-get install -y ./agent-os.deb
          pkg="$(dpkg-deb -f agent-os.deb Package)"
          server="$(dpkg -L "$pkg" | grep -m1 '/resources/server/server\.mjs$')"
          resources="$(dirname "$(dirname "$server")")"
          app="$(dpkg -L "$pkg" | grep -m1 -E '^/usr/bin/[^/]+$')"
          echo "Installed package $pkg: resources in $resources, program $app"
          node scripts/install-smoke.mjs --resources "$resources" --app "$app"

      # ---- macOS: open the DMG, copy the app out to a temporary folder, and run that copy.
      - name: Install and smoke test the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find installer -name '*.dmg' | head -n 1)"
          mount="$RUNNER_TEMP/dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/app"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          cp -R "$mount/Agent OS.app" "$RUNNER_TEMP/app/"
          hdiutil detach "$mount"
          contents="$RUNNER_TEMP/app/Agent OS.app/Contents"
          app="$(find "$contents/MacOS" -type f | head -n 1)"
          echo "Copied the app to $contents, program $app"
          node scripts/install-smoke.mjs --resources "$contents/Resources/resources" --app "$app"

      # ---- Windows: silent install into a fixed folder, then the smoke test.
      - name: Install and smoke test the setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $dir = 'C:\agent-os-smoke\install'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -PassThru
          if (-not $installer.WaitForExit(300000)) { $installer.Kill(); throw 'The installer did not finish in 5 minutes.' }
          if ($installer.ExitCode -ne 0) { throw "The installer exited with code $($installer.ExitCode)." }
          $app = (Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1).FullName
          Write-Host "Installed to $dir, program $app"
          node scripts/install-smoke.mjs --resources "$dir\resources" --app $app
          if ($LASTEXITCODE -ne 0) { throw "install-smoke exited with code $LASTEXITCODE" }

      # ---- Windows only: the upgrade. The newest PUBLISHED release is installed, its bundled node.exe
      # is kept running (so Windows holds the file open), and the NEW installer is run over it. The
      # installer hook (desktop/src-tauri/windows/hooks.nsh) must stop that node.exe so the update goes
      # through, and the new files must arrive.
      - name: Upgrade over a running older version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\agent-os-upgrade'
          New-Item -ItemType Directory -Force -Path old | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir old --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the latest published release setup.exe.' }
          $oldSetup = (Get-ChildItem old -Filter '*-setup.exe' | Select-Object -First 1).FullName
          Write-Host "Older installer: $(Split-Path $oldSetup -Leaf)"
          $oldRun = Start-Process -FilePath $oldSetup -ArgumentList '/S', "/D=$dir" -PassThru
          if (-not $oldRun.WaitForExit(300000)) { $oldRun.Kill(); throw 'The older installer did not finish in 5 minutes.' }
          $oldNode = Join-Path $dir 'resources\node\node.exe'
          if (-not (Test-Path $oldNode)) { throw "The older version has no $oldNode." }

          # A node.exe from the install folder that stays alive, so its file is held open.
          $held = Start-Process -FilePath $oldNode -ArgumentList '-e', 'setInterval(()=>{},1000)' -PassThru
          Start-Sleep -Seconds 2
          if ($held.HasExited) { throw 'The held node.exe did not start.' }

          $setup = (Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $newRun = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -PassThru
          if (-not $newRun.WaitForExit(300000)) { $newRun.Kill(); throw 'The new installer did not finish in 5 minutes (a running node.exe may have blocked it).' }
          if ($newRun.ExitCode -ne 0) { throw "The new installer exited with code $($newRun.ExitCode)." }

          Start-Sleep -Seconds 2
          if (Get-Process -Id $held.Id -ErrorAction SilentlyContinue) { throw 'The old node.exe is still running: the installer hook did not stop it.' }
          $notices = Join-Path $dir 'resources\server\THIRD_PARTY_NOTICES.md'
          if (-not (Test-Path $notices)) { throw "THIRD_PARTY_NOTICES.md is not in the install folder after the update ($notices)." }
          Write-Host 'Upgrade over a running older version: the old node.exe was stopped and the new files arrived.'
