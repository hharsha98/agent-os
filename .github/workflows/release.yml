name: Release

# Builds the Agent OS desktop app for macOS (Apple Silicon + Intel), Windows
# and Linux, and attaches the installers to a DRAFT GitHub Release. A human
# reviews the draft and clicks Publish (see desktop/README.md, "Releasing").
# Pattern copied from a workflow that has shipped three real releases.
#
# Three stages, so there is exactly one draft and one latest.json:
#   1. create-release  makes (or reuses) the one draft for the tag.
#   2. release         four builds upload their installers into that draft.
#   3. updater-json    writes latest.json last, and only if all four
#                      computers are present.
#
# The builds are unsigned (no Apple/Microsoft certificates). Updater signing
# is separate: the public key is in desktop/updater-pubkey.txt and the private
# key is the TAURI_SIGNING_PRIVATE_KEY secret. If either is missing, the
# "Updater" step below turns auto-update off and no latest.json is written.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.3.0). A pushed v* tag fills this in by itself."
        required: true

jobs:
  # Stage 1: make the ONE draft release that every build uploads into.
  # (Draft releases cannot be found by tag, so if each build created its own,
  # we would get one draft per platform. v0.3.0 hit exactly that.)
  create-release:
    runs-on: ubuntu-22.04
    # The repo's default token is read-only; creating a release needs write.
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # Needs .github/release-notes.md from the tagged commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Find or create the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Lines of "<id> <draft true/false>". Drafts are included because
          # this token can write to the repo.
          found="$(gh api "repos/$REPO/releases" --paginate \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | "\(.id) \(.draft)"')"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::More than one release already exists for $TAG (ids: $(printf '%s' "$found" | cut -d' ' -f1 | tr '\n' ' ')). Delete the extras by hand, then re-run."
            exit 1
          elif [ "$count" -eq 1 ]; then
            id="${found%% *}"
            draft="${found##* }"
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Bump the version (node scripts/bump-version.mjs) and tag a new one."
              exit 1
            fi
            echo "Reusing the existing draft release $id for $TAG."
          else
            id="$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="Agent OS $TAG" \
              -F body=@.github/release-notes.md \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
            echo "Created draft release $id for $TAG."
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # Stage 2: build every platform and upload into the draft from stage 1.
  release:
    needs: create-release
    # Needed to upload to the Release. The repo's default token is read-only;
    # without this every build succeeds and the LAST step dies with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    strategy:
      # One failing platform must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (DMG)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            node_platform: darwin
            node_arch: arm64
            args: --target aarch64-apple-darwin
          # Intel Mac built by cross-compiling on the Apple Silicon runner,
          # so we don't depend on Intel runner labels GitHub keeps retiring.
          - name: macOS Intel (DMG)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            node_platform: darwin
            node_arch: x64
            args: --target x86_64-apple-darwin
          # Pinned to 22.04, not the moving "latest" label: Tauri's webkit2gtk-4.1 packages match
          # 22.04, and AppImages should be built on an old base so they run
          # on users' older distros. No rpm: nobody asked for it.
          - name: Linux (DEB + AppImage)
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            node_platform: linux
            node_arch: x64
            args: --bundles deb,appimage
          # NSIS only, no MSI: WiX failed with no diagnostic on a similar app
          # (likely Windows' 260-character path limit on a deep node_modules).
          - name: Windows (NSIS setup.exe)
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            node_platform: win32
            node_arch: x64
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A manual run starts from a branch, not the tag. Check out the tag
          # itself so the release is exactly the tagged commit.
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Two macOS legs share a runner type; keep their caches apart.
          key: ${{ matrix.rust_target }}

      # Tauri v2's Linux prerequisites on ubuntu-22.04 (webkit2gtk 4.1, not 4.0).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Install dependencies
        run: npm ci

      # The app's own Node for the TARGET machine (SHA-256 checked against
      # nodejs.org). Fetched before prepare so the Intel Mac app gets an x64
      # Node even though this runner is arm64.
      - name: Fetch the bundled Node for this target
        run: node scripts/fetch-node.mjs --platform ${{ matrix.node_platform }} --arch ${{ matrix.node_arch }}

      # Builds the UI + server bundle into resources/. --skip-node so it
      # cannot replace the target's Node (fetched above) with this runner's.
      - name: Prepare desktop resources
        run: node scripts/prepare-desktop.mjs --skip-node

      # Auto-update is opt-in. Only when BOTH the signing key secret is set
      # AND desktop/updater-pubkey.txt holds a real public key do we turn on
      # signed update artifacts (latest.json + .sig files). Otherwise the
      # build has no auto-update and the app's update banner stays hidden.
      # Neither the key nor its password is ever printed.
      - name: Updater (only if a signing key is configured)
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pubkey="$(tr -d '\r\n ' < desktop/updater-pubkey.txt)"
          # A real Tauri public key is base64 that starts "untrusted comment:".
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [[ "$pubkey" == dW50cnVzdGVkIGNvbW1lbnQ6* ]]; then
            PUBKEY="$pubkey" node -e '
              const fs = require("fs");
              const config = {
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: {
                  pubkey: process.env.PUBKEY,
                  endpoints: ["https://github.com/hharsha98/agent-os/releases/latest/download/latest.json"],
                } },
              };
              fs.writeFileSync("desktop/src-tauri/tauri.updater.conf.json", JSON.stringify(config));
            '
            # Relative to desktop/, where tauri-action runs the build.
            echo "extra_args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Updater: ON (signing key and public key both present)."
          else
            echo "extra_args=" >> "$GITHUB_OUTPUT"
            echo "::warning::Updater: OFF. Add the TAURI_SIGNING_PRIVATE_KEY secret and fill desktop/updater-pubkey.txt to enable auto-update."
          fi

      # Runs `tauri build` and uploads the installers (and .sig files, when
      # the updater is on) into the draft made by create-release. It does not
      # write latest.json (uploadUpdaterJson: false): four builds doing that at
      # once could overwrite each other, so the updater-json job does it last.
      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only read when updater artifacts are on. Empty is fine otherwise.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Skips the macOS DMG "make Finder pretty" AppleScript step, which
          # hangs on a headless runner. Kept to THIS step only, never on installs.
          CI: true
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extra_args }}

  # Stage 3: write latest.json once, after every build has uploaded. It checks
  # that all four computers are present and fails (uploading nothing) if not.
  updater-json:
    needs: [create-release, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Write latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/assemble-latest-json.mjs
