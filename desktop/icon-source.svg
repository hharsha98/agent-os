<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Agent OS app icon">
  <!-- The Agent OS app icon: the Orbit mark (the same mark as src/ui/Logo.tsx)
       on a dark rounded tile. Regenerate every size with:
       npx tauri icon desktop/icon-source.svg -o desktop/src-tauri/icons
       then delete the android and ios folders it creates, because the desktop
       app does not ship them. -->
  <title>Agent OS</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".55" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="mk" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0C0E12" filter="url(#lift)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <g transform="translate(200 200) scale(26)" filter="url(#mk)">
    <g transform="translate(-0.9 0)"><mask id="aos-cut-i" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28"><rect x="-2" y="-2" width="28" height="28" fill="#fff"/><circle cx="19.99" cy="9.4" r="4" fill="#000"/></mask><circle cx="12" cy="12" r="8.4" fill="none" stroke="#E6E9EF" stroke-width="1.8" mask="url(#aos-cut-i)"/><circle cx="12" cy="3.6" r="1.85" fill="#E6E9EF"/><circle cx="16.94" cy="18.8" r="1.85" fill="#E6E9EF"/><circle cx="7.06" cy="18.8" r="1.85" fill="#E6E9EF"/><circle cx="4.01" cy="9.4" r="1.85" fill="#E6E9EF"/><circle cx="19.99" cy="9.4" r="3" fill="#3866EE"/></g>
  </g>
</svg>
