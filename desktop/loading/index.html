<!doctype html>
<!--
  The desktop app's `frontendDist` (see ../src-tauri/tauri.conf.json): the
  first thing the window shows, while the bundled Node server starts. Once
  the server prints its ready line, main.rs navigates the window to the real
  app and this page disappears. If the server fails, main.rs eval()s a script
  that fills #status with a plain-English message and adds the `error`
  class (and hides #spinner), so the user is never left staring at a blank,
  spinning window.

  Static on purpose: no scripts, no external requests, no web fonts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent OS</title>
    <style>
      /* Same colours as src/ui/tokens.css so the hand-off to the real app
         doesn't flash a different theme. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0C0E12;
        color: #E6E9EF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        max-width: 460px;
        padding: 0 24px;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 22px;
        display: block;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 0 auto 16px;
        border-radius: 50%;
        border: 2px solid rgba(148, 163, 184, 0.18);
        border-top-color: #3866EE;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
        color: #9AA3B2;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #status.error {
        color: #e5675f;
        text-align: left;
        font-size: 13px;
        background: rgba(229, 103, 95, 0.08);
        border: 1px solid rgba(229, 103, 95, 0.4);
        border-radius: 10px;
        padding: 14px 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-0.9 0)"><mask id="aos-cut" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28"><rect x="-2" y="-2" width="28" height="28" fill="#fff"/><circle cx="19.99" cy="9.4" r="4" fill="#000"/></mask><circle cx="12" cy="12" r="8.4" fill="none" stroke="#E6E9EF" stroke-width="1.8" mask="url(#aos-cut)"/><circle cx="12" cy="3.6" r="1.85" fill="#E6E9EF"/><circle cx="16.94" cy="18.8" r="1.85" fill="#E6E9EF"/><circle cx="7.06" cy="18.8" r="1.85" fill="#E6E9EF"/><circle cx="4.01" cy="9.4" r="1.85" fill="#E6E9EF"/><circle cx="19.99" cy="9.4" r="3" fill="#3866EE"/></g></svg>
      <div class="spinner" id="spinner"></div>
      <div id="status" role="status">Starting Agent OS…</div>
    </div>
  </body>
</html>
