<!doctype html>
<!--
  The desktop app's `frontendDist` (see ../src-tauri/tauri.conf.json): the
  first thing the window shows, while the bundled Node server starts. Once
  the server prints its ready line, main.rs navigates the window to the real
  app and this page disappears. If the server fails, main.rs eval()s a script
  that fills #status with a plain-English message and adds the `error`
  class (and hides #spinner), so the user is never left staring at a blank,
  spinning window.

  Static on purpose: no scripts, no external requests, no web fonts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent OS</title>
    <style>
      /* Same colours as src/ui/tokens.css so the hand-off to the real app
         doesn't flash a different theme. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070b;
        color: #e9eef5;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 900px 600px at 8% 0%, rgba(92, 225, 255, 0.07), transparent 60%),
          radial-gradient(ellipse 900px 700px at 100% 100%, rgba(140, 120, 255, 0.06), transparent 60%),
          #05070b;
      }
      .wrap {
        text-align: center;
        max-width: 460px;
        padding: 0 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 22px;
        border-radius: 14px;
        background: linear-gradient(135deg, #5ce1ff, #8aebff);
        color: #031018;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 28px;
        box-shadow: 0 0 0 1px rgba(92, 225, 255, 0.35), 0 0 32px rgba(92, 225, 255, 0.18);
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 0 auto 16px;
        border-radius: 50%;
        border: 2px solid rgba(148, 163, 184, 0.18);
        border-top-color: #5ce1ff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
        color: #a7b2c2;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #status.error {
        color: #ff5c7a;
        text-align: left;
        font-size: 13px;
        background: rgba(255, 92, 122, 0.08);
        border: 1px solid rgba(255, 92, 122, 0.3);
        border-radius: 10px;
        padding: 14px 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">A</div>
      <div class="spinner" id="spinner"></div>
      <div id="status" role="status">Starting Agent OS…</div>
    </div>
  </body>
</html>
